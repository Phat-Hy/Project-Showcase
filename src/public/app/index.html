<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gara Showcase Platform Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0e1a;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .loader-box {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(139, 92, 246, 0.1);
      border-left-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 0.95rem;
      color: #9ca3af;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="loader-box">
    <div class="spinner"></div>
    <div class="loading-text">Đang xác thực phiên đăng nhập...</div>
  </div>

  <script>
    async function checkAuthAndRedirect() {
      try {
        const response = await fetch('/api/auth/me');
        if (!response.ok) {
          window.location.href = '/app/login.html';
          return;
        }

        const user = await response.json();
        
        // Role-based routing
        if (user.role === 'Manager') {
          window.location.href = '/app/admin.html';
        } else if (user.role === 'Founder') {
          window.location.href = '/app/founder.html';
        } else {
          window.location.href = '/app/student.html';
        }
      } catch (err) {
        console.error('Lỗi xác thực:', err);
        window.location.href = '/app/login.html';
      }
    }

    // Run auth check on load
    window.addEventListener('load', checkAuthAndRedirect);
  </script>
</body>
</html>
