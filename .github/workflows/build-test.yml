name: CI - Build & Test

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Build & Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: garashowcase_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Validate Frontend Build & Typing
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Install Native Windows Binding Bypass for Linux CI
        working-directory: frontend
        run: npm install @rolldown/binding-linux-x64-gnu --no-save

      - name: Compile & Build Frontend
        working-directory: frontend
        run: npm run build

      # 2. Validate C# Backend Compilation
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Backend Packages
        working-directory: backend
        run: dotnet restore

      - name: Compile Backend
        working-directory: backend
        run: dotnet build --configuration Release

      # 3. Security Scanning
      - name: Run Trivy Security Scan (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
